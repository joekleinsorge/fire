services:
  planner:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FIRE_HOST: 0.0.0.0
      FIRE_PORT: 8080
      FIRE_DB: /data/planner.sqlite3
    volumes:
      - planner-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  planner-data:
