{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openfi
  namespace: openfi
  annotations:
    external-dns.kubernetes.io/hostname: {{ .Values.route.hostname | quote }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.route.hostname | quote }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.route.dnsTarget | quote }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: https
  hostnames: [{{ .Values.route.hostname | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: openfi, port: 80}
{{- end }}
