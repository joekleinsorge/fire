{{- $image := required "Set image to the published image@sha256:digest" .Values.image -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "image must use an immutable sha256 digest" -}}
{{- end -}}
{{- if not (has (int .Values.replicas) (list 0 1)) -}}
{{- fail "SQLite deployment supports only zero or one replica" -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: openfi
  labels:
    istio.io/dataplane-mode: none
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfi-data
  namespace: openfi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfi
  namespace: openfi
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openfi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: planner
          image: {{ $image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: FIRE_HOST, value: "0.0.0.0"}
            - {name: FIRE_PORT, value: "8080"}
            - {name: FIRE_DB, value: /data/planner.sqlite3}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: openfi-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: openfi
  namespace: openfi
spec:
  selector:
    app.kubernetes.io/name: openfi
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfi-ingress
  namespace: openfi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfi
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - ipBlock: {cidr: 192.168.1.100/32}
        - ipBlock: {cidr: 192.168.1.101/32}
        - ipBlock: {cidr: 192.168.1.102/32}
        - ipBlock: {cidr: 192.168.1.103/32}
      ports: [{protocol: TCP, port: 8080}]
